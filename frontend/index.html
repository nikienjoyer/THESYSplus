<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon"  href="new logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser chrome colour = --color-canvas (the navbar). ThemeContext keeps it in sync with the in-app theme toggle. -->
    <meta name="theme-color" content="#f8fafc" />
    <title>THESYS+</title>
    <!--
      Phase 2.C-1: Inter Variable is loaded via @font-face with font-display:swap
      in src/index.css (imported from @fontsource-variable/inter).
      A manual <link rel="preload"> is intentionally omitted here because Vite
      hashes all asset filenames at build time; a static href cannot target
      the hashed woff2 path. font-display:swap ensures no invisible text (FOIT)
      and the Latin subset (48 KB) loads quickly from the same origin.
      If a preload is desired in production, use vite-plugin-webfont-dl or
      add a Vite plugin that injects the preload with the correct hashed path.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
